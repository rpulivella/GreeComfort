# The posting half of the merge-readiness report, and the only automation here that writes.
# A workflow reached by `workflow_run` checks out the default branch, so this runs no branch
# code, and what the branch produced arrives as an artifact. It only fires once this file is
# on the default branch. Adapted from pybers' merge-readiness.yml.
name: merge readiness

on:
  workflow_run:
    workflows: [readiness]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  post:
    # Only after a readiness run that did something: a draft skips readiness, and posting then would bill for nothing.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install what posting needs
        # `rich` alone: this half imports no part of the integration.
        run: pip install rich

      - name: Take what the checking job rendered
        id: rendered
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: merge-readiness
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A draft, or a run that never reached the checking job, rendered nothing to post.
      - name: Post the report
        if: steps.rendered.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/merge-readiness.py report --results merge-readiness.json --comment merge-readiness.md
