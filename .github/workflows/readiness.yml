# The checking half of the merge-readiness report, and its own workflow so GitHub reports
# it as its own check. It reads this branch and holds no write access; the comment it
# renders is posted by merge-readiness.yml, which runs the default branch's code.
# Adapted from pybers' readiness.yml.
name: readiness

on:
  pull_request:
    branches: [develop]
    # `edited` as well, because the template and checklist checks read the body.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  readiness:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The facts read this branch's log against the base, which a shallow checkout lacks.
          fetch-depth: 0

      - name: Fetch the base branch the facts compare against
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install the test requirements
        # The whole set, because the dependency check asks what a fresh install resolves.
        run: pip install -r requirements_test.txt

      - name: Collect this branch's facts
        run: |
          python scripts/merge-readiness.py collect \
            --pull-request ${{ github.event.pull_request.number }} \
            --base origin/${{ github.event.pull_request.base.ref }} \
            --branch ${{ github.event.pull_request.head.ref }} \
            --head-sha ${{ github.event.pull_request.head.sha }} \
            --output merge-readiness.json

      - name: Check merge readiness
        # A red verdict fails this step, which is the check a merge is refused on.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/merge-readiness.py check --results merge-readiness.json --comment merge-readiness.md

      - name: Hand the report to the posting half
        # Always, because a red report is the one most worth posting.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merge-readiness
          path: |
            merge-readiness.json
            merge-readiness.md
          retention-days: 1
